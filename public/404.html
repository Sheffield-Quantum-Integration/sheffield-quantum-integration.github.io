<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA deep-link support.
      // If this repository is ever served from a subpath, change pathSegmentsToKeep to 1.
      const pathSegmentsToKeep = 0
      const l = window.location
      // Remember the path before redirecting. Some browsers drop a long ?/ query
      // and land on /. index.html reads this and restores the deep link.
      const returnPath = l.pathname + l.search + l.hash
      if (returnPath !== '/' && returnPath.startsWith('/') && !returnPath.startsWith('//')) {
        try {
          sessionStorage.setItem('sqil-spa-return', returnPath)
        } catch (error) {}
      }

      l.replace(
        `${l.protocol}//${l.hostname}${l.port ? `:${l.port}` : ''}${
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
        }/?/${l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')}${l.search ? `&${l.search.slice(1).replace(/&/g, '~and~')}` : ''}${l.hash}`
      )
    </script>
  </head>
  <body></body>
</html>
